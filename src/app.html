<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- The page connects to these hosts and no other, so that even a script
		     injected into it could not send a reader's token elsewhere. -->
		<meta
			http-equiv="Content-Security-Policy"
			content="connect-src 'self' https://api.github.com https://raw.githubusercontent.com https://ungh.cc"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
