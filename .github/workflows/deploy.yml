name: Deploy to GitHub Pages

on:
  push:
    branches: 'main'
  workflow_dispatch:

env:
  # corepack otherwise asks before downloading the pinned pnpm version.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          # @sveltejs/kit@3 requires >= 22.17
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run check

      - name: Unit tests
        run: pnpm test

      - name: Build
        # No BASE_PATH: the repository has its own custom domain,
        # tatr-explorer.broutin.dev, which serves the site from the root.
        run: pnpm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'build/'

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
